name: invest_dwh
version: '1.0.0'
config-version: 2

# Name of the block in ~/.dbt/profiles.yml
profile: invest_dwh

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  invest_dwh:
    # Send the descriptions from the yml files to BigQuery itself, so the
    # console and the data catalog show them, not only dbt docs.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    dm:
      +materialized: table
      +schema: dm
