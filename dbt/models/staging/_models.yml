version: 2

models:
  - name: stg_moex_history
    description: "MOEX daily trade history. One row per trade day, board and security."
    columns:
      - name: history_key
        description: "Surrogate key: dt, board and sec_id."
        data_tests:
          - unique
          - not_null
      - name: market
        description: "Market code taken from the GCS path, for example shares."
      - name: board
        description: "Board code taken from the GCS path, for example TQBR."
        data_tests:
          - not_null
      - name: dt
        description: "Trade date, taken from the GCS path."
        data_tests:
          - not_null
      - name: sec_id
        description: "Security ticker on the board."
        data_tests:
          - not_null
      - name: board_id
        description: >
          Board code taken from the file. It must be equal to board, which
          comes from the path.
      - name: trade_date
        description: >
          Trade date taken from the file. It must be equal to dt, which comes
          from the path. A singular test on this pair is planned.
      - name: trade_session_date
        description: "Trade day of the session, from the file."
      - name: trading_session
        description: "Number of the trading session."
      - name: short_name
        description: "Short name of the security."
      - name: currency_id
        description: "Currency of the trades, for example SUR."
      - name: open_price
        description: "Price of the pre-trade period, or price of the opening auction."
      - name: high_price
        description: "Highest trade price of the day."
      - name: low_price
        description: "Lowest trade price of the day."
      - name: close_price
        description: "Price of the last trade of the day."
      - name: legal_close_price
        description: >
          Closing price of the day. It is not the same as close_price: that
          one is only the last trade, this one is the price the exchange
          publishes as the close.
      - name: wa_price
        description: "Weighted average price of the day."
      - name: market_price_2
        description: "Market price (2) in roubles, computed by the exchange."
      - name: market_price_3
        description: "Market price (3) in roubles, computed by the exchange."
      - name: admitted_quote
        description: >
          Recognized quote. The exchange stopped to compute it on 2023-01-30,
          so it is null in all our data, which starts in 2025.
      - name: trend_close_price
        description: >
          Change of the last trade price against the last trade price of the
          previous trade day, in percent.
      - name: num_trades
        description: "Number of trades in the day."
      - name: volume
        description: "Number of securities traded in the day."
      - name: trade_value
        description: "Turnover of the day in the trade currency."
      - name: mp2_value_traded
        description: "Turnover used to compute market price (2), in roubles."
      - name: market_price_3_value
        description: "Turnover used to compute market price (3), in roubles."
      - name: admitted_value
        description: >
          Turnover used to compute the recognized quote. Stopped on
          2023-01-30 as well, so it is null in all our data.
      - name: avg_turnover_3m
        description: >
          Average daily turnover of trades with units over three months. The
          name in ISS is WAVAL, but it has nothing to do with wa_price. For
          an ordinary share it holds 0, not null, so count() and avg() over
          this column mix real values of funds with zeros of shares.
      - name: extracted_at
        description: "When the file was written by the extract script."
  - name: stg_moex_listing
    description: >
      MOEX board listing. One row per board and security. The source keeps
      the interval of board membership in listing_from_date and
      listing_till_date, so this layer stores no history of its own.
    columns:
      - name: listing_key
        description: >
          Surrogate key: board and sec_id. The unique test on it holds our
          assumption that one ticker has one interval on one board. A ticker
          can be given to another issuer after a delisting; today the source
          has no such case, and the day it appears this test goes red.
        data_tests:
          - unique
          - not_null
      - name: market
        description: "Market code taken from the GCS path, for example shares."
      - name: board
        description: "Board code taken from the GCS path, for example TQBR."
        data_tests:
          - not_null
      - name: sec_id
        description: "Security ticker on the board."
        data_tests:
          - not_null
      - name: board_id
        description: >
          Board code taken from the file. It must be equal to board. The two
          come from different places, the path and the data, so a singular
          test on this pair is planned.
      - name: short_name
        description: "Short name of the security."
      - name: full_name
        description: "Full name of the security, the legal name of the issue."
      - name: price_decimals
        description: >
          Number of decimal places in the price on this board. This is price
          precision, not the listing level of the exchange.
      - name: listing_from_date
        description: "First trade date of the security on the board."
      - name: listing_till_date
        description: >
          Last trade date of the security on the board. It is never null:
          for a security that still trades it holds the last closed trade
          day. So "listing_till_date is null" does not mean "trades now".
      - name: extracted_at
        description: >
          When the file was written by the extract script. The whole table
          is rewritten on every load, so this is the freshness of the
          reference data.
  - name: stg_moex_splits
    description: >
      MOEX splits. One row per security and split date. The table is small,
      56 rows today, and the source gives it in full on every load.
    columns:
      - name: split_key
        description: >
          Surrogate key: trade_date and sec_id. One security can have more
          than one split, FXRU has two, so the date belongs to the key.
        data_tests:
          - unique
          - not_null
      - name: engine
        description: >
          Engine code taken from the GCS path, for example stock. The source
          gives one table for the whole engine, not per market or board.
        data_tests:
          - not_null
      - name: trade_date
        description: >
          Date of the split. It is the first trade day with the new price:
          PLZL closed at 19011.5 before 2025-03-27 and at 1867.6 on that
          day. So prices from this date are already on the new scale, and
          only older prices need the correction. Trades often stop for a few
          days before the split, and on those days close is null while
          legal_close_price still holds the old price.
        data_tests:
          - not_null
      - name: sec_id
        description: "Security ticker."
        data_tests:
          - not_null
      - name: split_before
        description: >
          Number of securities before the split, the denominator of the
          correction factor.
      - name: split_after
        description: >
          Number of securities after the split, the numerator of the
          correction factor. A price older than trade_date is corrected by
          the product of split_after / split_before over every later split.
          Both sides are always above zero, and a singular test keeps it so:
          a zero would either break the division or silently zero out every
          price before the split.
      - name: extracted_at
        description: >
          When the file was written by the extract script. The whole table
          is rewritten on every load, so this is the freshness of the
          reference data.
